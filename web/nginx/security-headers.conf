# Included in every location: nginx drops server-level add_header lines in any location that adds its own.
# Everything is bundled and same-origin (engineering standards §12.4), so the policy allows nothing else.
# data: images are the CAPTCHA and QR codes, and photos inside diary entries. style-src-attr allows the
# font and size style attributes in entries (the sanitiser allows nothing else in them); <style> elements and
# scripts stay blocked.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
