server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    # The API, including its own request IDs and error bodies. One diary entry can be up to 10 MB (§8.3).
    location /api/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10m;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Built files have content hashes in their names, so they never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # The install manifest; nginx's mime table may not know the extension. Never cached, like sw.js below,
    # so a new version is found on the next visit.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Every other path is a screen of the single-page app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
