# Included in every location: nginx drops server-level add_header lines in any location that adds its own.
# Everything is bundled and same-origin (engineering standards §12.4), so the policy allows nothing else.
# data: images are the CAPTCHA and QR codes (and, from slice 13, photos inside diary entries).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
